services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/graph:/var/lib/neo4j/import   # shared CSV folder
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_THREADS=48
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graphrag-app
    depends_on:
      - neo4j
      - ollama
    ports:
      - "8888:8888"
    env_file:
      - ../.env
    volumes:
      - ../.env:/app/.env:ro
      - ../src:/app/src
      - ../notebooks:/app/notebooks
      - ../data:/app/data
      - ./data/graph:/neo4j-import         # unified import folder for Neo4j + notebooks
      - ../tests:/app/tests
    environment:
      - PYTHONPATH=/app
      - NEO4J_IMPORT_DIR=/neo4j-import
      - NEO4J_URI=neo4j://neo4j:7687
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:

