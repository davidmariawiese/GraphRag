services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/graph:/var/lib/neo4j/import   # shared CSV folder
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graphrag-app
    depends_on:
      - neo4j
      - ollama
    ports:
      - "8888:8888"
    volumes:
      - ../src:/app/src
      - ../notebooks:/app/notebooks
      - ../data:/app/data
      - ./data/graph:/neo4j-import          # same folder for notebook export
    environment:
      - PYTHONPATH=/app
      - NEO4J_IMPORT_DIR=/neo4j-import
    restart: unless-stopped
